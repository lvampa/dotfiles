# Remap prefix
set -g prefix C-j
unbind-key C-b
bind-key C-j send-prefix

# Bind split pane commands to open current directory path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

# start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# longer scrollback
set -g history-limit 50000

# mouse support
set -g mouse on

# set alerts on cli tools to notify panel when waiting for input
bind M setw monitor-silence 30 \; display "Silence monitor on"
bind m setw monitor-silence 0 \; display "Silence monitor off"
